<!--/* TOTC Stats Strip. */-->
<sly data-sly-use.model="com.demo.core.models.totc.StatsStripModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"></sly>
<sly data-sly-call="${clientlib.css @ categories='demo-ai-site.totc.stats-strip'}"></sly>

<section class="cmp-totc-stats-strip">
    <ul class="cmp-totc-stats-strip__list">
        <li class="cmp-totc-stats-strip__item"
            data-sly-repeat.stat="${model.stats}">
            <span class="cmp-totc-stats-strip__value">${stat.value}</span>
            <span class="cmp-totc-stats-strip__label">${stat.label}</span>
        </li>
    </ul>
    <sly data-sly-test="${!model.hasContent && wcmmode.edit}">
        <div class="cmp-totc-stats-strip__placeholder cq-placeholder"
             data-emptytext="TOTC Stats Strip — add stats via dialog."></div>
    </sly>
</section>
