<!--/* Partners component */-->
<sly data-sly-use.model="com.demo.core.models.PartnersModel"/>
<sly data-sly-test="${model.hasContent}">
    <section class="cmp-partners" data-cmp-is="partners">
        <p class="cmp-partners__eyebrow" data-sly-test="${model.eyebrow}">${model.eyebrow}</p>
        <div class="cmp-partners__grid" data-sly-list.card="${model.cards}">
            <a class="cmp-partners__card"
               href="${card.href @ context='uri'}"
               style="background-color: ${card.safeBg @ context='styleString'};">
                <div class="cmp-partners__card-header">
                    <h2 class="cmp-partners__card-title">${card.title}</h2>
                    <span class="cmp-partners__card-arrow" aria-hidden="true">
                        <svg viewBox="0 0 89 88" width="89" height="88" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 44 L68 44 M50 26 L68 44 L50 62" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
                        </svg>
                    </span>
                </div>
                <p class="cmp-partners__card-body" data-sly-test="${card.body}">${card.body}</p>
            </a>
        </div>
    </section>
</sly>
<sly data-sly-test="${!model.hasContent && wcmmode.edit}">
    <div class="cmp-partners cmp-partners--empty">Please configure the Partners component.</div>
</sly>
