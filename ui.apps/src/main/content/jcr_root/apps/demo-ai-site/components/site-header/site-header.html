<!--/* Site Header — authored inside the site-header Experience Fragment */-->
<sly data-sly-use.model="com.demo.core.models.SiteHeaderModel"/>
<header class="cmp-site-header" data-cmp-is="site-header">
    <div class="cmp-site-header__utility">
        <sly data-sly-list.utility="${model.utilityItems}">
            <a class="cmp-site-header__utility-item cmp-site-header__utility-item--${utility.icon}"
               href="${utility.href @ context='uri'}"
               aria-label="${utility.ariaLabel @ context='attribute'}">
                <sly data-sly-test="${utility.icon == 'search'}">
                    <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#131313" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                </sly>
                <span data-sly-test="${utility.label}">${utility.label}</span>
            </a>
        </sly>
        <span class="cmp-site-header__utility-item cmp-site-header__utility-item--region"
              data-sly-test="${model.regionLabel}"
              aria-label="Region">
            <svg viewBox="0 0 24 24" width="14" height="14" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#131313" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
            <span>${model.regionLabel}</span>
        </span>
    </div>
    <div class="cmp-site-header__main">
