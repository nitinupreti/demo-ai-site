<!--/* Service List component */-->
<sly data-sly-use.model="com.demo.core.models.ServiceListModel"/>
<sly data-sly-test="${model.hasContent}">
    <section class="cmp-service-list" data-cmp-is="service-list">
        <div class="cmp-service-list__inner">
            <p class="cmp-service-list__eyebrow" data-sly-test="${model.eyebrow}">${model.eyebrow}</p>
            <div class="cmp-service-list__grid" data-sly-list.service="${model.services}">
                <article class="cmp-service-list__card">
                    <a class="cmp-service-list__card-title-link"
                       href="${service.href @ context='uri'}"
                       data-sly-test="${service.href}">
                        <h2 class="cmp-service-list__card-title">${service.title}
                            <span class="cmp-service-list__card-arrow" aria-hidden="true">
                                <svg viewBox="0 0 89 88" width="89" height="88" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M14 44 L68 44 M50 26 L68 44 L50 62" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
                                </svg>
                            </span>
                        </h2>
                    </a>
                    <h2 class="cmp-service-list__card-title" data-sly-test="${!service.href}">${service.title}</h2>
                    <ul class="cmp-service-list__sublinks" data-sly-list.link="${service.links}">
                        <li class="cmp-service-list__sublink-item">
                            <a class="cmp-service-list__sublink"
                               href="${link.href @ context='uri'}"
                               data-sly-test="${link.href}">${link.label}</a>
                            <span class="cmp-service-list__sublink"
                                  data-sly-test="${!link.href}">${link.label}</span>
                        </li>
                    </ul>
                </article>
            </div>
        </div>
    </section>
</sly>
<sly data-sly-test="${!model.hasContent && wcmmode.edit}">
    <div class="cmp-service-list cmp-service-list--empty">Please configure the Service List component.</div>
</sly>
