<!--/* TOTC Hero. */-->
<sly data-sly-use.model="com.demo.core.models.totc.HeroModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"></sly>
<sly data-sly-call="${clientlib.css @ categories='demo-ai-site.totc.hero'}"></sly>

<section class="cmp-totc-hero" data-cmp-is="totc-hero">
    <div class="cmp-totc-hero__inner">
        <div class="cmp-totc-hero__copy">
            <h1 class="cmp-totc-hero__title" data-sly-test="${model.titlePrefix || model.titleRest}">
                <span class="cmp-totc-hero__title-accent" data-sly-test="${model.titlePrefix}">${model.titlePrefix}</span><sly data-sly-test="${model.titlePrefix && model.titleRest}"> </sly><span class="cmp-totc-hero__title-rest" data-sly-test="${model.titleRest}">${model.titleRest}</span>
            </h1>
            <p class="cmp-totc-hero__subtitle" data-sly-test="${model.subtitle}">${model.subtitle}</p>
            <div class="cmp-totc-hero__ctas">
                <a class="cmp-totc-hero__btn cmp-totc-hero__btn--primary"
                   data-sly-test="${model.primaryCtaLabel}"
                   href="${model.primaryCtaLink || '#' @ context='uri'}">${model.primaryCtaLabel}</a>
                <a class="cmp-totc-hero__btn cmp-totc-hero__btn--secondary"
                   data-sly-test="${model.secondaryCtaLabel}"
                   href="${model.secondaryCtaLink || '#' @ context='uri'}">
                    <span class="cmp-totc-hero__play" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="24" height="24"><polygon points="8,5 20,12 8,19" fill="currentColor"/></svg>
                    </span>
                    <span class="cmp-totc-hero__btn-label">${model.secondaryCtaLabel}</span>
                </a>
            </div>
        </div>

        <div class="cmp-totc-hero__media" data-sly-test="${model.heroImage || model.floatingCards.size > 0}">
            <div class="cmp-totc-hero__media-frame">
                <img data-sly-test="${model.heroImage}"
                     class="cmp-totc-hero__image"
                     src="${model.heroImage @ context='uri'}"
                     alt="${model.heroImageAlt || '' @ context='attribute'}"/>
            </div>
            <sly data-sly-list.card="${model.floatingCards}">
                <div class="cmp-totc-hero__card cmp-totc-hero__card--pos-${card.position @ context='attribute'} cmp-totc-hero__card--icon-${card.iconStyle @ context='attribute'}">
                    <div class="cmp-totc-hero__card-icon" aria-hidden="true"></div>
                    <div class="cmp-totc-hero__card-body">
                        <p class="cmp-totc-hero__card-title" data-sly-test="${card.title}">${card.title}</p>
                        <p class="cmp-totc-hero__card-subtitle" data-sly-test="${card.subtitle}">${card.subtitle}</p>
                        <a class="cmp-totc-hero__card-cta" data-sly-test="${card.ctaLabel}" href="#">${card.ctaLabel}</a>
                    </div>
                </div>
            </sly>
        </div>
    </div>

    <sly data-sly-test="${!model.hasContent && wcmmode.edit}">
        <div class="cmp-totc-hero__placeholder cq-placeholder"
             data-emptytext="TOTC Hero — configure via dialog."></div>
    </sly>
</section>
