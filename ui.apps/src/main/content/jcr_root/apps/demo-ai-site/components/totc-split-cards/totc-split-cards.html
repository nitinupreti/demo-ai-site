<!--/* TOTC Split Cards. */-->
<sly data-sly-use.model="com.demo.core.models.totc.SplitCardsModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"></sly>
<sly data-sly-call="${clientlib.css @ categories='demo-ai-site.totc.split-cards'}"></sly>

<section class="cmp-totc-split-cards">
    <div class="cmp-totc-split-cards__inner">
        <ul class="cmp-totc-split-cards__list">
            <li class="cmp-totc-split-cards__item cmp-totc-split-cards__item--tint-${card.tint @ context='attribute'}"
                data-sly-repeat.card="${model.cards}">
                <img data-sly-test="${card.backgroundImage}"
                     class="cmp-totc-split-cards__image"
                     src="${card.backgroundImage @ context='uri'}" alt=""/>
                <div class="cmp-totc-split-cards__overlay"></div>
                <div class="cmp-totc-split-cards__content">
                    <p class="cmp-totc-split-cards__label">${card.label}</p>
                    <a class="cmp-totc-split-cards__cta"
                       href="${card.ctaLink || '#' @ context='uri'}">${card.ctaLabel}</a>
                </div>
            </li>
        </ul>
    </div>
    <sly data-sly-test="${!model.hasContent && wcmmode.edit}">
        <div class="cmp-totc-split-cards__placeholder cq-placeholder"
             data-emptytext="TOTC Split Cards — configure via dialog."></div>
    </sly>
</section>
