<!--/* Insights List component */-->
<sly data-sly-use.model="com.demo.core.models.InsightsListModel"/>
<sly data-sly-test="${model.hasContent}">
    <section class="cmp-insights-list" data-cmp-is="insights-list">
        <p class="cmp-insights-list__eyebrow" data-sly-test="${model.eyebrow}">${model.eyebrow}</p>
        <div class="cmp-insights-list__grid" data-sly-list.card="${model.cards}">
            <a class="cmp-insights-list__card" href="${card.href @ context='uri'}">
                <div class="cmp-insights-list__card-media">
                    <img data-sly-test="${card.imagePath}"
                         class="cmp-insights-list__card-image"
                         src="${card.imagePath @ context='uri'}"
                         alt="${card.imageAlt @ context='attribute'}"/>
                    <div data-sly-test="${!card.imagePath}" class="cmp-insights-list__card-image cmp-insights-list__card-image--placeholder" aria-hidden="true"></div>
                </div>
                <div class="cmp-insights-list__card-body">
                    <h3 class="cmp-insights-list__card-heading">${card.heading}</h3>
                    <div class="cmp-insights-list__card-meta">
                        <span class="cmp-insights-list__card-category" data-sly-test="${card.category}">${card.category}</span>
                        <span class="cmp-insights-list__card-cta">Read on <span aria-hidden="true">&#8594;</span></span>
                    </div>
                </div>
            </a>
        </div>
        <div class="cmp-insights-list__scrollbar" aria-hidden="true">
            <div class="cmp-insights-list__scrollbar-track">
                <div class="cmp-insights-list__scrollbar-thumb"></div>
            </div>
        </div>
    </section>
</sly>
<sly data-sly-test="${!model.hasContent && wcmmode.edit}">
    <div class="cmp-insights-list cmp-insights-list--empty">Please configure the Insights List component.</div>
</sly>
