<sly data-sly-use.model="com.demo.core.models.ServicesModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
    <sly data-sly-call="${clientlib.css @ categories='demo-ai-site.pos-services'}"/>

    <sly data-sly-test.hasContent="${model.hasContent}">
        <section class="cmp-pos-services">
            <ul class="cmp-pos-services__grid">
                <li class="cmp-pos-services__card cmp-pos-services__card--${card.variant @ context='attribute'}"
                    data-sly-repeat.card="${model.cards}">
                    <div class="cmp-pos-services__content">
                        <h3 class="cmp-pos-services__title">
                            <span class="cmp-pos-services__title-line" data-sly-test="${card.titleTop}">${card.titleTop}</span>
                            <span class="cmp-pos-services__title-line" data-sly-test="${card.titleBottom}">${card.titleBottom}</span>
                        </h3>
                        <a class="cmp-pos-services__link"
                           href="${card.linkPath @ context='uri'}"
                           data-sly-test="${card.linkText}">
                            <span class="cmp-pos-services__link-icon" aria-hidden="true">↗</span>
                            <span class="cmp-pos-services__link-text">${card.linkText}</span>
                        </a>
                    </div>
                    <div class="cmp-pos-services__illustration" data-sly-test="${card.illustration}">
                        <img src="${card.illustration @ context='uri'}"
                             alt="${card.illustrationAlt @ context='attribute'}"/>
                    </div>
                </li>
            </ul>
        </section>
    </sly>

    <sly data-sly-test="${!hasContent && wcmmode.edit}">
        <div class="cq-placeholder" data-emptytext="${'Positivus Services Grid' @ i18n}"></div>
    </sly>
</sly>
