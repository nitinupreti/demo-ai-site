<!--/* TOTC Site Header — top navigation bar. */-->
<sly data-sly-use.model="com.demo.core.models.totc.SiteHeaderModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"></sly>
<sly data-sly-call="${clientlib.css @ categories='demo-ai-site.totc.site-header'}"></sly>

<header class="cmp-totc-site-header cmp-totc-site-header--theme-${model.theme @ context='attribute'}"
        data-cmp-is="totc-site-header">
    <div class="cmp-totc-site-header__inner">
        <a class="cmp-totc-site-header__logo" href="#" aria-label="${model.logoText @ context='attribute'}">
            <span class="cmp-totc-site-header__logo-mark" aria-hidden="true"></span>
            <span class="cmp-totc-site-header__logo-text">${model.logoText}</span>
        </a>

        <nav class="cmp-totc-site-header__nav" data-sly-test="${model.navLinks.size > 0}"
             aria-label="Primary">
            <ul class="cmp-totc-site-header__nav-list">
                <li class="cmp-totc-site-header__nav-item"
                    data-sly-repeat.item="${model.navLinks}">
                    <a class="cmp-totc-site-header__nav-link"
                       href="${item.link || '#' @ context='uri'}">${item.label}</a>
                </li>
            </ul>
        </nav>

        <div class="cmp-totc-site-header__actions">
            <a class="cmp-totc-site-header__btn cmp-totc-site-header__btn--login"
               href="${model.loginLink || '#' @ context='uri'}"
               data-sly-test="${model.loginLabel}">${model.loginLabel}</a>
            <a class="cmp-totc-site-header__btn cmp-totc-site-header__btn--signup"
               href="${model.signupLink || '#' @ context='uri'}"
               data-sly-test="${model.signupLabel}">${model.signupLabel}</a>
        </div>
    </div>

    <sly data-sly-test="${!model.hasContent && wcmmode.edit}">
        <div class="cmp-totc-site-header__placeholder cq-placeholder"
             data-emptytext="TOTC Site Header — configure via dialog."></div>
    </sly>
</header>
