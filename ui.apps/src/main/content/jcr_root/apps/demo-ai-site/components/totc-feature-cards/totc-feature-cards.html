<!--/* TOTC Feature Cards. */-->
<sly data-sly-use.model="com.demo.core.models.totc.FeatureCardsModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"></sly>
<sly data-sly-call="${clientlib.css @ categories='demo-ai-site.totc.feature-cards'}"></sly>

<section class="cmp-totc-feature-cards">
    <div class="cmp-totc-feature-cards__inner">
        <ul class="cmp-totc-feature-cards__list">
            <li class="cmp-totc-feature-cards__item"
                data-sly-repeat.card="${model.cards}">
                <div class="cmp-totc-feature-cards__icon cmp-totc-feature-cards__icon--${card.iconVariant @ context='attribute'}" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <sly data-sly-test="${card.iconGlyph == 'invoice'}"><path d="M14 6h16l6 6v30H14zM30 6v6h6M20 22h14M20 30h14M20 38h9"/></sly>
                        <sly data-sly-test="${card.iconGlyph == 'calendar'}"><rect x="8" y="12" width="32" height="30" rx="2"/><path d="M8 22h32M16 6v10M32 6v10"/></sly>
                        <sly data-sly-test="${card.iconGlyph == 'users'}"><circle cx="18" cy="18" r="5"/><circle cx="34" cy="18" r="5"/><path d="M6 40c0-6 6-10 12-10s12 4 12 10M28 40c0-4 4-8 10-8s8 3 8 8"/></sly>
                        <sly data-sly-test="${card.iconGlyph == 'chart'}"><path d="M8 40h32M14 32V22M22 32V16M30 32V10M38 32V6"/></sly>
                    </svg>
                </div>
                <h3 class="cmp-totc-feature-cards__title">${card.title}</h3>
                <p class="cmp-totc-feature-cards__description" data-sly-test="${card.description}">${card.description}</p>
            </li>
        </ul>
    </div>
    <sly data-sly-test="${!model.hasContent && wcmmode.edit}">
        <div class="cmp-totc-feature-cards__placeholder cq-placeholder"
             data-emptytext="TOTC Feature Cards — add cards via dialog."></div>
    </sly>
</section>
