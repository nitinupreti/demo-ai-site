<!--/*
    Footer — dark navy site footer with three columns: About, Instagram Shop grid, Follow Us social row.
*/-->
<sly data-sly-use.model="com.demo.core.models.FooterModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>

<sly data-sly-call="${clientlib.css @ categories='demo-ai-site.footer'}"/>

<sly data-sly-test.hasContent="${model.hasContent}">
    <footer class="cmp-footer cmp-footer--style-${model.style @ context='attribute'}"
            data-cmp-is="footer">
        <div class="cmp-footer__inner">
            <div class="cmp-footer__col cmp-footer__col--about">
                <h3 class="cmp-footer__heading" data-sly-test="${model.aboutHeading}">${model.aboutHeading}</h3>
                <div class="cmp-footer__body" data-sly-test="${model.aboutBody}">${model.aboutBody @ context='html'}</div>
                <sly data-sly-test="${model.hasSocialItems}">
                    <h3 class="cmp-footer__heading cmp-footer__heading--follow" data-sly-test="${model.followHeading}">${model.followHeading}</h3>
                    <ul class="cmp-footer__social" data-sly-list.social="${model.socialItems}">
                        <li class="cmp-footer__social-item" data-index="${socialList.index}">
                            <a class="cmp-footer__social-link"
                               href="${social.link @ context='uri'}"
                               aria-label="${social.label @ context='attribute'}">
                                <span class="cmp-footer__social-icon" aria-hidden="true">
                                    <sly data-sly-test="${social.network == 'facebook'}">
                                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false" fill="currentColor">
                                            <path d="M13.5 21v-8h2.7l.4-3.1h-3.1V7.9c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.1v2.3H7.7V13h2.6v8h3.2z"/>
                                        </svg>
                                    </sly>
                                    <sly data-sly-test="${social.network == 'instagram'}">
                                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8">
                                            <rect x="3" y="3" width="18" height="18" rx="5"/>
                                            <circle cx="12" cy="12" r="4"/>
                                            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
                                        </svg>
                                    </sly>
                                    <sly data-sly-test="${social.network == 'twitter'}">
                                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false" fill="currentColor">
                                            <path d="M18.9 4H21l-6.6 7.6L22 20h-6.1l-4.8-6.3L5.6 20H3.5l7.1-8.1L2.9 4H9l4.3 5.7L18.9 4zm-1 14.6h1.2L7.1 5.3H5.8l12.1 13.3z"/>
                                        </svg>
                                    </sly>
                                    <sly data-sly-test="${social.network == 'youtube'}">
                                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false" fill="currentColor">
                                            <path d="M22.5 6.5c-.2-1-1-1.7-2-2C18.7 4 12 4 12 4s-6.7 0-8.5.5c-1 .3-1.8 1-2 2C1 8.3 1 12 1 12s0 3.7.5 5.5c.2 1 1 1.7 2 2 1.8.5 8.5.5 8.5.5s6.7 0 8.5-.5c1-.3 1.8-1 2-2 .5-1.8.5-5.5.5-5.5s0-3.7-.5-5.5zM10 15.5v-7l6 3.5-6 3.5z"/>
                                        </svg>
                                    </sly>
                                    <sly data-sly-test="${social.network == 'linkedin'}">
                                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" focusable="false" fill="currentColor">
                                            <path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S.02 4.88.02 3.5 1.13 1 2.5 1s2.48 1.12 2.48 2.5zM0 8h5v13H0V8zm7.5 0H12v1.8h.1c.6-1.1 2.2-2.3 4.5-2.3 4.8 0 5.7 3.2 5.7 7.3V21h-5v-6c0-1.4 0-3.3-2-3.3s-2.3 1.5-2.3 3.2V21h-5V8z"/>
                                        </svg>
                                    </sly>
                                </span>
                            </a>
                        </li>
                    </ul>
                </sly>
            </div>

            <div class="cmp-footer__col cmp-footer__col--instagram" data-sly-test="${model.hasInstagramItems}">
                <h3 class="cmp-footer__heading" data-sly-test="${model.instagramHeading}">${model.instagramHeading}</h3>
                <ul class="cmp-footer__ig-list" data-sly-list.ig="${model.instagramItems}">
                    <li class="cmp-footer__ig-item" data-index="${igList.index}">
                        <a class="cmp-footer__ig-link"
                           data-sly-test.hasLink="${ig.link}"
                           href="${ig.link @ context='uri'}">
                            <img class="cmp-footer__ig-image"
                                 src="${ig.image @ context='uri'}"
                                 alt="${ig.imageAlt @ context='attribute'}"
                                 loading="lazy"/>
                        </a>
                        <sly data-sly-test="${!hasLink}">
                            <img class="cmp-footer__ig-image"
                                 src="${ig.image @ context='uri'}"
                                 alt="${ig.imageAlt @ context='attribute'}"
                                 loading="lazy"/>
                        </sly>
                    </li>
                </ul>
            </div>
        </div>
    </footer>
</sly>

<sly data-sly-test="${!hasContent && wcmmode.edit}">
    <div class="cq-placeholder cmp-footer__placeholder"
         data-emptytext="${'Footer — configure about, instagram and follow-us columns' @ i18n}"></div>
</sly>
