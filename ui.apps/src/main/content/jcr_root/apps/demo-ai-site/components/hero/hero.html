<!--/* Hero component */-->
<sly data-sly-use.model="com.demo.core.models.HeroModel"/>
<sly data-sly-test="${model.hasContent}">
    <section class="cmp-hero" data-cmp-is="hero">
        <div class="cmp-hero__inner">
            <p class="cmp-hero__eyebrow"
               data-sly-test="${model.eyebrow}">${model.eyebrow}</p>
            <h1 class="cmp-hero__heading"
                data-sly-test="${model.heading}">${model.heading @ context='html'}</h1>
            <hr class="cmp-hero__divider" aria-hidden="true"/>
            <p class="cmp-hero__body"
               data-sly-test="${model.body}">${model.body @ context='html'}</p>
            <a class="cmp-hero__cta"
               data-sly-test="${model.ctaLabel && model.ctaHref}"
               href="${model.ctaHref @ context='uri'}">
                <span class="cmp-hero__cta-label">${model.ctaLabel}</span>
                <span class="cmp-hero__cta-arrow" aria-hidden="true">&#8594;</span>
            </a>
        </div>
        <div class="cmp-hero__seal" aria-hidden="true">
            <svg viewBox="0 0 160 160" width="160" height="160">
                <defs>
                    <path id="cmp-hero-seal-path" d="M80,80 m-60,0 a60,60 0 1,1 120,0 a60,60 0 1,1 -120,0"/>
                </defs>
                <circle cx="80" cy="80" r="80" fill="#3d3ff0"/>
                <text fill="#ffffff" font-family="DM Sans, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">
                    <textPath href="#cmp-hero-seal-path" startOffset="0%">TRANSFORMATION &#8226; CONSULTANCY &#8226; </textPath>
                </text>
                <g transform="translate(80,80) rotate(-15)">
                    <polygon points="-14,-14 14,-14 14,14 -14,14" fill="none" stroke="#ffffff" stroke-width="2"/>
                    <polygon points="-14,-14 14,14 M14,-14 L-14,14" fill="none" stroke="#ffffff" stroke-width="2"/>
                </g>
            </svg>
        </div>
    </section>
</sly>

<!--/* Empty state for authors */-->
<sly data-sly-test="${!model.hasContent && wcmmode.edit}">
    <div class="cmp-hero cmp-hero--empty">Please configure the Hero component.</div>
</sly>
