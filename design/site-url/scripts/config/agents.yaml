# Agent roster.
#
# One entry per agent role. The Python classes only supply behaviour that cannot
# be expressed declaratively (fan-out shape, result post-processing); everything
# else — prompt, model, budget, and the result contract each agent must satisfy —
# is authored here.

version: 1

defaults:
  prompt_dir: design/site-url/scripts/prompts
  model: null            # inherits model.default from migration.yaml
  effort: null
  max_continues: null
  timeout_seconds: null
  result_status_values: [PASS, FAIL, BLOCKED]
  required_result_keys: [agent, run_id, status]

agents:
  planner:
    title: Planner
    prompt: planner.md
    # Planning is analysis over frozen evidence. The shared pass below writes real
    # source and pins its own effort; nested modes otherwise inherit this value.
    effort: medium
    description: >-
      First emits a read-only component plan and measured token specification.
      A separately validated shared pass establishes tokens, styles and policies
      only after plan acceptance, before any component workers start.
    required_result_keys: [agent, run_id, status, components, design_tokens]
    required_checks:
      - all_breakpoints_ready
      - all_discovery_signals_executed
      - exactly_once_coverage
      - no_unclaimed_gap_20px
      - every_instance_has_stable_source_selector
    outputs:
      components: outputs.components
      coverage_report: outputs.coverage_report
      source_selector_map: outputs.source_selector_map
      design_tokens: outputs.design_tokens
    # Shape each planned component must have. Missing required fields fail the
    # plan before a single implementation agent is started.
    component_schema:
      required: [id, name, tier, delivery, resource_type, source_selectors, source_order]
      optional:
        - instances
        - visible_breakpoints
        - owning_module
        - execution_mode
        - owned_paths
        - contribution_targets
        - depends_on
        - reuse_target
        - assets
        - authorable_fields
        - interactions
        - notes
      id_pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
      tier_values: [1, 2, 3, 4]
      delivery_values: [component, experience-fragment]
      execution_mode_values: [authoring, implementation]

    diagnostic:
      title: Planner recovery diagnosis
      prompt: recovery.md
      required_result_keys: [agent, run_id, status, decision]
      # A successful envelope always carries at least one evidence-backed check;
      # for a diagnosis that evidence is the reviewed failure packet.
      required_checks: [failure_evidence_reviewed]
      outputs:
        decision: outputs.decision

    shared:
      title: Planner shared files
      prompt: foundations.md
      effort: high
      required_result_keys: [agent, run_id, status, components, changed_files, token_manifest]
      required_checks:
        - shared_tokens_ready
        - shared_policies_ready
      outputs:
        components: outputs.components
        changed_files: outputs.changed_files
        token_manifest: outputs.token_manifest

  component:
    title: Component builder
    prompt: component.md
    description: >-
      Groups source-ready content authoring across all reuse tiers into a read-only
      session. Implements source changes individually in isolated source snapshots,
      with focused-test declarations and authored contributions. Shared source
      requests go to the planner; deterministic code owns build and acceptance.
    required_result_keys: [agent, run_id, status, component_id, changed_files, parity_targets]
    required_checks: [every_business_value_authorable, assets_authored_from_dam, focused_test_declared]
    outputs:
      changed_files: outputs.changed_files
      resource_type: outputs.resource_type
      authored_paths: outputs.authored_paths
      focused_test: outputs.focused_test

    contribution_repair:
      title: Component contribution repair
      prompt: contribution-repair.md

    reuse:
      title: Component authoring
      prompt: reuse.md
      required_result_keys: [agent, run_id, status, results]
      required_checks: [authoring_results_recorded]

  deployer:
    title: Deterministic deployment worker
    prompt: deployer.md
    description: >-
      Runs configured validation, tests, OOTB code assessment and scoped Maven
      deployments in dependency order, then verifies live AEM evidence without
      a model call. Reuses component-focused tests and supports evidence-backed
      reactor fallback. Returns repair diagnostics to the existing source owners;
      never edits application source or treats missing runtime probes as a pass.
    required_result_keys: [agent, run_id, status, deploy_commands, target_url]
    required_checks:
      - focused_tests_pass
      - scoped_deploy_succeeded
      - packages_and_bundles_active
      - disabled_and_author_runtime_valid
      - target_selectors_resolve_uniquely
      - assets_reachable_and_decoded
      - live_repository_matches_intent
    outputs:
      deploy_commands: outputs.deploy_commands
      target_url: outputs.target_url
      runtime_sweep: outputs.runtime_sweep
      asset_manifest: outputs.asset_manifest

  parity:
    title: Deterministic visual parity
    prompt: parity.md
    description: >-
      Coordinator-run Playwright captures live-source and AEM evidence, checks
      exact styles, geometry, media and declared interaction states, and independently
      scores every component and page. No model call is made for comparison.
    required_result_keys: [agent, run_id, status, scores, failing_components]
    required_checks:
      - all_source_blocks_mapped_once
      - all_live_and_aem_screenshot_pairs_valid
      - all_geometry_and_properties_pass
      - all_interactions_and_media_pass
    outputs:
      scores: outputs.scores
      failing_components: outputs.failing_components
      screenshot_index: outputs.screenshot_index
      runner: outputs.runner
    score_schema:
      required: [component_id, instance_id, breakpoint, mode, source_image, target_image, live_url, aem_url, dpr, screenshot_validation]
